[project]
name = "aria-garmin-sync"
version = "0.1.0"
description = "Sync Fitbit Aria weigh-ins from the Google Health API to Garmin Connect"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "garminconnect>=0.3",
    "curl_cffi",
    "cryptography>=43",
]

[project.scripts]
aria-sync = "aria_garmin_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria_garmin_sync"]
